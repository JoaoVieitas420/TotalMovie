<ion-header>
  <ion-toolbar>
    <ion-title>TotalMovie</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="router.navigate(['/tabs/search'])">
        <ion-icon name="search" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="!isLoading">
    <h2>New Releases</h2>
    <div class="horizontal-scroll">
      <div class="movie-card" *ngFor="let movie of destaques">
        <ion-card (click)="verDetalhes(movie.imdbID)" style="cursor:pointer;">
          <img [src]="movie.Poster !== 'N/A' ? movie.Poster : ''" />
          <ion-card-header>
            <ion-card-title>{{ movie.Title }}</ion-card-title>
            <ion-card-subtitle>{{ movie.Year }}</ion-card-subtitle>
          </ion-card-header>
          <div class="imdb-rating">
            IMDb: {{ movie.imdbRating }}
          </div>
        </ion-card>
      </div>
    </div>

    <h2 style="margin-top: 2rem;">Popular</h2>
    <div class="horizontal-scroll">
      <div class="movie-card" *ngFor="let movie of populares">
        <ion-card (click)="verDetalhes(movie.imdbID)" style="cursor:pointer;">
          <img [src]="movie.Poster !== 'N/A' ? movie.Poster : ''" />
          <ion-card-header>
            <ion-card-title>{{ movie.Title }}</ion-card-title>
            <ion-card-subtitle>{{ movie.Year }}</ion-card-subtitle>
          </ion-card-header>
          <div class="imdb-rating">
            IMDb: {{ movie.imdbRating }}
          </div>
        </ion-card>
      </div>
    </div>
  </div>
</ion-content>
