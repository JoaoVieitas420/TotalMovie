<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Perfil</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="navegarParaPesquisa()">
        <ion-icon name="search" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <!-- HEADER -->
  <div class="profile-header">
    <div class="profile-photo-wrapper">
      <img [src]="profilePhotoUrl" alt="Foto de Perfil" class="profile-photo" />
    </div>
    <h2 class="profile-name">{{ nome }}</h2>
    <p class="profile-email">{{ email }}</p>
  </div>

  <!-- INFO -->
  <div class="profile-info-card">
    <ion-list lines="none">
      <ion-item *ngIf="bio">
        <ion-icon name="information-circle-outline" slot="start"></ion-icon>
        <ion-label>
          <strong>Bio:</strong><br />
          {{ bio }}
        </ion-label>
      </ion-item>

      <ion-item *ngIf="localizacao">
        <ion-icon name="location-outline" slot="start"></ion-icon>
        <ion-label>
          <strong>Localização:</strong><br />
          {{ localizacao }}
        </ion-label>
      </ion-item>

      <ion-item *ngIf="estiloPreferido">
        <ion-icon name="film-outline" slot="start"></ion-icon>
        <ion-label>
          <strong>Estilo Favorito:</strong><br />
          {{ estiloPreferido }}
        </ion-label>
      </ion-item>
    </ion-list>
  </div>

  <!-- AÇÕES -->
  <div class="profile-actions">
    <ion-button expand="block" color="primary" (click)="editarPerfil()">Editar Perfil</ion-button>
    <ion-button expand="block" color="danger" (click)="logout()">Terminar Sessão</ion-button>
  </div>

</ion-content>
