<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="profile-container">
    <!-- Foto de perfil com ícone de câmera -->
    <div class="profile-photo-wrapper" (click)="selecionarFoto()">
      <img src="assets/icon/Pedro.avif" alt="Foto de Perfil" class="profile-photo" />
      <ion-icon name="camera" class="camera-icon" (click)="selecionarFoto($event)"></ion-icon>
    </div>

    <!-- Input escondido para escolher foto -->
    <input type="file" accept="image/*" #fileInput hidden (change)="onFileSelected($event)" />

    <!-- Nome e email -->
    <h2 class="profile-username">Pedro Silva</h2>
    <p class="profile-email">pedross&#64;gmail.com</p>

    <!-- Botões -->
    <ion-button expand="block" class="edit-btn" (click)="editarPerfil()">Editar Perfil</ion-button>
  </div>
</ion-content>
