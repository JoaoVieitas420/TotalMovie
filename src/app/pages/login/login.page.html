<ion-content class="ion-padding login-content">
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Bem-vindo de volta</h1>
      <p>Inicia sessão na tua conta para continuares</p>

      <ion-item lines="inset" class="auth-input" [class.invalid]="emailTouched && !isEmailValid(email)">
        <ion-label position="floating">Email</ion-label>
        <ion-input
          [(ngModel)]="email"
          type="email"
          inputmode="email"
          (ionBlur)="emailTouched = true">
        </ion-input>
      </ion-item>
      <small *ngIf="emailTouched && !isEmailValid(email)" class="error-msg">Email inválido</small>

      <ion-item lines="inset" class="auth-input" [class.invalid]="passwordTouched && !isPasswordValid(password)">
        <ion-label position="floating">Palavra-passe</ion-label>
        <ion-input
          [(ngModel)]="password"
          type="password"
          (ionBlur)="passwordTouched = true">
        </ion-input>
      </ion-item>
      <small *ngIf="passwordTouched && !isPasswordValid(password)" class="error-msg">A palavra-passe deve ter pelo menos 6 caracteres</small>

      <ion-button shape="round" size="default" (click)="login()" class="auth-button" [disabled]="!isFormValid()">
        <ion-icon slot="start" name="log-in-outline"></ion-icon>
        Entrar
      </ion-button>

      <div class="auth-footer">
        <p>Não tens conta? <a routerLink="/register">Regista-te</a></p>
      </div>
    </div>
  </div>
</ion-content>
