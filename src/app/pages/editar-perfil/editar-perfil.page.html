<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Editar Perfil</ion-title>
    <ion-buttons slot="start">
      <!-- Botão para voltar ao perfil -->
      <ion-back-button defaultHref="/tabs/perfil"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <!-- Formulário para editar o perfil -->
  <form (submit)="guardar()">
    <!-- Secção para editar a foto de perfil -->
    <div class="edit-photo-wrapper">
      <img [src]="fotoPreview || 'assets/img/default-profile.jpg'" alt="Foto de Perfil" class="edit-profile-photo" />
      <!-- Ícone de câmara para selecionar nova foto -->
      <ion-icon name="camera" class="edit-camera-icon" (click)="abrirSeletor()"></ion-icon>
    </div>
    <!-- Input escondido para upload de imagem -->
    <input type="file" hidden #fileInput (change)="selecionarFoto($event)" accept="image/*" />

    <!-- Campo para editar o nome -->
    <ion-item>
      <ion-label position="stacked">Nome</ion-label>
      <ion-input [(ngModel)]="nome" name="nome" required></ion-input>
    </ion-item>

    <!-- Campo para editar a bio -->
    <ion-item>
      <ion-label position="stacked">Bio</ion-label>
      <ion-textarea [(ngModel)]="bio" name="bio"></ion-textarea>
    </ion-item>

    <!-- Campo de email (apenas leitura) -->
    <ion-item>
      <ion-label position="stacked">Email</ion-label>
      <ion-input [(ngModel)]="email" name="email" readonly></ion-input>
    </ion-item>
    
    <!-- Campo para editar a localização -->
    <ion-item>
      <ion-label position="stacked">Localização</ion-label>
      <ion-input [(ngModel)]="localizacao" name="localizacao"></ion-input>
    </ion-item>

    <!-- Seleção de estilos de filmes preferidos (multi-seleção) -->
    <ion-item>
      <ion-label position="stacked">Estilo Preferido de Filmes</ion-label>
      <ion-select [(ngModel)]="estiloPreferido" name="estiloPreferido" interface="popover" multiple="true">
        <ion-select-option *ngFor="let genero of generos" [value]="genero.id">{{ genero.name }}</ion-select-option>
      </ion-select>
    </ion-item>

    <!-- Botão para guardar as alterações -->
    <ion-button expand="block" type="submit" class="ion-margin-top" color="totalmovie">Guardar</ion-button>
  </form>
</ion-content>
